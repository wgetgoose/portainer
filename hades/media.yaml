  #     - PLEX_CLAIM=${CLAIM}
  #   volumes:
  #     - ${LOCALCONFIG}/plex:/config
  #     - ${SYNOLOGY}/music:/music
  #     - ${SYNOLOGY}/tv:/tv
  #     - ${SYNOLOGY}/movies:/movies
  #   restart: unless-stopped
  unmanic:
    container_name: unmanic
    image: josh5/unmanic:latest
    ports:
      - 8888:8888
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${LOCALCONFIG}/unmanic/config:/config
      - ${SYNOLOGY}:/library
      - ${LOCALCONFIG}/unmanic/cache:/tmp/unmanic
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${LOCALCONFIG}/sonarr:/config
      - ${SYNOLOGY}:/data
    ports:
      - 8989:8989
    restart: unless-stopped
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${LOCALCONFIG}/radarr:/config
      - ${SYNOLOGY}:/data
    ports:
      - 7878:7878
    restart: unless-stopped
  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${LOCALCONFIG}/bazarr:/config
      - ${SYNOLOGY}:/data #optional
    ports:
      - 6767:6767
    restart: unless-stopped
  jackett:
    image: linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - AUTO_UPDATE=true #optional
      - RUN_OPTS= #optional
    volumes:
      - ${LOCALCONFIG}/jackett:/config
    ports:
      - 9117:9117
    restart: unless-stopped
  flaresolverr:
    # Using fork of flaresolverr for TL
    image: 21hsmw/flaresolverr:nodriver 
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
      - DRIVER=nodriver
    ports:
      - "${PORT:-8191}:8191"
    restart: unless-stopped
