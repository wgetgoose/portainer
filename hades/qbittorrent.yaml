services:
  gluetun:
    container_name: gluetun
    image: qmcgaw/gluetun:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 20480:20480 # qbittorrent
      #- ${WIREGUARD_IN_PORT}:${WIREGUARD_IN_PORT} # map airvpn port to qbit port
      # - 6080:6080 # soulseek
    environment:
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=openvpn
      # Disabling wireguard until bug fix: https://github.com/qdm12/gluetun/issues/3003
      #- VPN_TYPE=wireguard
      #- WIREGUARD_PRIVATE_KEY=${WIREGUARD_KEY}
      #- WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      #- WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_CITIES=${SERVER_CITIES}
      - FIREWALL_VPN_INPUT_PORTS=${WIREGUARD_IN_PORT}
      # Have gluetun pull from available VPN servers list
      - UPDATER_PERIOD=12h
    volumes:
      - /home/carson/webapps_local/gluetun:/gluetun
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=20480
      - TORRENTING_PORT=${WIREGUARD_IN_PORT}
    volumes:
      - ${LOCALCONFIG}:/config
      - ${SYNOLOGY}:/data/torrents
    restart: unless-stopped
    network_mode: "container:gluetun"