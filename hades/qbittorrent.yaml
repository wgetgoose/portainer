services:
  gluetun:
    container_name: gluetun
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 20481:20481 # qbittorrent
      - ${WIREGUARD_IN_PORT}:${WIREGUARD_IN_PORT} # map airvpn port to qbit port
      - ${WIREGUARD_IN_PORT}:${WIREGUARD_IN_PORT}/udp # map airvpn port to qbit port
    environment:
      - VPN_SERVICE_PROVIDER=airvpn
      #- VPN_TYPE=openvpn
      # Disabling wireguard until bug fix: https://github.com/qdm12/gluetun/issues/3003
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_KEY}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_CITIES=${SERVER_CITIES}
      - FIREWALL_VPN_INPUT_PORTS=${WIREGUARD_IN_PORT}
      # Have gluetun pull from available VPN servers list
      - UPDATER_PERIOD=12h
    volumes:
      - ${LOCALCONFIG}/gluetun:/gluetun
    restart: unless-stopped
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=20481
      - TORRENTING_PORT=${WIREGUARD_IN_PORT}
    volumes:
      - ${LOCALCONFIG}/qbittorrent:/config
      - ${SYNOLOGY}:/data/torrents
    restart: unless-stopped
    network_mode: service:gluetun