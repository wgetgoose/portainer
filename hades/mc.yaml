services:
  mc:
    image: itzg/minecraft-server
    container_name: minecraft
    ports:
      - "25565:25565"
    volumes:
      - ${DATA}:/data
    environment:
      EULA: "true"
      VERSION: LATEST
      MOTD: ${MOTD}
      DIFFICULTY: normal
      MAX_PLAYERS: "9"
    stdin_open: true
    tty: true
    restart: unless-stopped